name = webRotor
summary = Web Rotor (เว็บโรเตอร์)
description = เพิ่มเมนูหมุน (Rotor) สำหรับสำรวจองค์ประกอบของหน้าเว็บอย่างรวดเร็ว รองรับ 23 หมวด (หัวเรื่อง ลิงก์ จุดสังเกต ปุ่ม ช่องแบบฟอร์ม ตาราง รายการ กราฟิก ย่อหน้า ฯลฯ) เรียกใช้ด้วย Control+Windows+U เปิดขึ้นมาโฟกัสอยู่ที่รายการทันที พิมพ์ตัวอักษรเพื่อกระโดดไปยังรายการที่ขึ้นต้นด้วยตัวนั้น ลูกศรขึ้น/ลงเพื่อเลื่อนดูรายการ ลูกศรซ้าย/ขวาเพื่อเปลี่ยนหมวดหมู่ หรือ Shift+Tab ไปยังแท็บหมวดหมู่ กด Alt+ตัวอักษรเพื่อกระโดดตรงไปยังหมวดหมู่ที่ต้องการ (ใช้ได้ทั้งแป้นอังกฤษและแป้นไทย) และ Enter หรือ Space เพื่อกระโดดไปยังตำแหน่งนั้น มีหน้าตั้งค่าให้เลือกภาษา (อังกฤษ/ไทย ค่าเริ่มต้นเป็นอังกฤษ) เลือกและจัดลำดับหมวดหมู่ได้เอง ตัวเลือกให้ NVDA+F7 เปิดเว็บโรเตอร์แทน Elements List เดิม และตัวเลือกทดลองบล็อกปุ่มลัดอื่นของ NVDA ชั่วคราว (Control+Windows+Shift+U หรือผ่านเมนู Preferences)
author = Peera Pilarit <peera@cfbt.or.th>
