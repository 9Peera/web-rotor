name = webRotor
summary = Web Rotor (เว็บโรเตอร์)
description = เพิ่มเมนูหมุน (Rotor) สำหรับสำรวจองค์ประกอบของหน้าเว็บอย่างรวดเร็ว รองรับ 23 หมวด (หัวเรื่อง ลิงก์ จุดสังเกต ปุ่ม ช่องแบบฟอร์ม ตาราง รายการ กราฟิก ย่อหน้า ฯลฯ) เรียกใช้ด้วย Control+Windows+U มีช่องกรองรายการแบบเรียลไทม์ ใช้ลูกศรซ้าย/ขวาหรือ Ctrl+ลูกศรซ้าย/ขวาเพื่อเปลี่ยนหมวดหมู่ หรือกด Alt+ตัวอักษร (เปลี่ยนตามภาษาที่ตั้งค่า) เพื่อกระโดดตรงไปยังหมวดหมู่ที่ต้องการ ลูกศรขึ้น/ลงเพื่อเลื่อนดูรายการ และ Enter หรือ Space เพื่อกระโดดไปยังตำแหน่งนั้น (ใช้ได้จากทุกจุดในหน้าต่าง) มีหน้าตั้งค่าให้เลือกภาษา (อังกฤษ/ไทย ค่าเริ่มต้นเป็นอังกฤษ) เลือกและจัดลำดับหมวดหมู่ได้เอง ตัวเลือกให้ NVDA+F7 เปิดเว็บโรเตอร์แทน Elements List เดิม และตัวเลือกทดลองบล็อกปุ่มลัดอื่นของ NVDA ชั่วคราว (Control+Windows+Shift+U หรือผ่านเมนู Preferences)
author = Peera Pilarit <peera@cfbt.or.th>
